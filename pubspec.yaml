name: gongura_griha
description: "Authentic Gongura Pickles - E-commerce Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Network
  dio: ^5.8.0
  connectivity_plus: ^6.1.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^14.8.1

  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1

  # Payment
  razorpay_flutter: ^1.3.7

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.2.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5

  # Utils
  dartz: ^0.10.1
  intl: any
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  image_picker: ^1.2.1
  share_plus: ^10.1.4

  # Forms & Validation
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.0

  # Other
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.0.0
  badges: ^3.1.2
  pinput: ^5.0.1
  lottie: ^3.3.1
  firebase_storage: ^12.4.10
  flutter_local_notifications: ^19.5.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/illustrations/
    - assets/images/onboarding/
    - assets/icons/

  # Using Google Fonts package for Poppins font (loads from network)
  # To use local fonts, download Poppins fonts and uncomment:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins/Poppins-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Poppins/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins/Poppins-Bold.ttf
  #         weight: 700
